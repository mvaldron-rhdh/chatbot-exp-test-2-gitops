apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chatbot-exp-test-2-app-tekton
  namespace: openshift-gitops
  finalizers: ["resources-finalizer.argocd.argoproj.io"]
spec:
  project: default
  source:
    path: ./components/chatbot-exp-test-2/overlays/tekton
    repoURL: https://github.com/mvaldron-rhdh/chatbot-exp-test-2-gitops.git
    targetRevision: main
  destination:
    namespace: rolling-demo
    server: https://kubernetes.default.svc
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: openshift-gitops
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
